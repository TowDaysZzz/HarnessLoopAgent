# 复制为 config.yaml，并填写所选模型配置档案的 API_KEY。
HTTP_ADDR: ":8080"
SHUTDOWN_TIMEOUT: "10s"
ACTIVE_MODEL: "deepseek"

# 启用后开放会话、Run 和 SSE API。MySQL 是会话与事件的事实来源。
# DSN 可以留空并通过 DATABASE_DSN 环境变量注入，避免把密码提交到仓库。
DATABASE:
  ENABLED: false
  DSN: ""
  AUTO_MIGRATE: false
  MAX_OPEN_CONNS: 20
  MAX_IDLE_CONNS: 10
  CONN_MAX_LIFETIME: "5m"

AUTH:
  ENABLED: false
  SESSION_SECRET: "replace-with-at-least-32-random-characters"
  SESSION_TTL: "168h"
  COOKIE_NAME: "note_agent_session"
  COOKIE_SECURE: false

NOTE:
  ENABLED: false
  KB_ID: 0

# 三层记忆默认完全关闭。MySQL 是事实来源，RAG 仅保存 append-only 向量投影。
# 凭证建议通过 MEMORY_RAG_SERVICE_TOKEN 和 MEMORY_OWNER_CLAIM_SECRET 环境变量注入。
MEMORY:
  ENABLED: false
  RAG_ENABLED: false
  PROJECTION_ENABLED: false
  WORKFLOW_PILOT_ENABLED: false
  # 当前生产基线。没有稳定 selector 时返回空结果/澄清，不扫描用户全部 Memory。
  RECALL_MODE: "exact-only"
  STRUCTURED_PLAN_MIN_CONFIDENCE: 0.75
  MAX_RECALL_SELECTORS: 8
  MAX_EXACT_CANDIDATES: 40
  MAX_CANDIDATE_TEXT_CHARS: 16000
  MAX_LLM_RESPONSE_BYTES: 16384
  MAX_LLM_REPAIR_ATTEMPTS: 1
  DEFAULT_SESSION_TTL: "24h"
  RECALL_TARGET: 10
  RECALL_PAGE_SIZE: 20
  MAX_SCANNED: 200
  MAX_BATCHES: 10
  MAX_CONTEXT_CHARS: 12000
  CONFLICT_THRESHOLD: 0.8
  PROJECTION_BATCH_SIZE: 50
  PROJECTION_BASE_BACKOFF: "1s"
  PROJECTION_MAX_BACKOFF: "5m"
  PROJECTION_MAX_ATTEMPTS: 8
  RAG_ENDPOINT: "http://127.0.0.1:8899"
  RAG_TIMEOUT: "10s"
  RAG_SERVICE_TOKEN: ""
  OWNER_CLAIM_SECRET: ""
  PROJECTION_VERSION: "v1"

# Reminder 默认关闭。首版仅支持 Asia/Shanghai 的一次性提醒。
# WORKER_ENABLED 只能在接入支持稳定 delivery key 的生产适配器后开启。
REMINDER:
  ENABLED: false
  WORKFLOW_PILOT_ENABLED: false
  DISPATCHER_ENABLED: false
  WORKER_ENABLED: false
  BATCH_SIZE: 20
  MAX_BATCHES: 5
  MAX_ATTEMPTS: 8
  LEASE_DURATION: "30s"
  INTERVAL: "1s"
  MAX_HORIZON: "8760h"
  RETRY_BASE_BACKOFF: "1s"
  RETRY_MAX_BACKOFF: "5m"
  TIMEZONE: "Asia/Shanghai"
  PRODUCTION_DELIVERY_ADAPTER: ""

# 当前使用有界最近消息窗口。后续 ProgressiveCompactor 将实现同一组装接口。
CONTEXT:
  MAX_INPUT_TOKENS: 24000
  MIN_RECENT_MESSAGES: 6
  MESSAGE_HISTORY_LIMIT: 100

# OpenAI、DeepSeek、通义千问兼容模式、硅基流动等使用同一个
# openai-compatible Provider，只需要配置不同的接口地址和模型名称。
MODELS:
  deepseek:
    PROVIDER: "openai-compatible"
    BASE_URL: "https://api.deepseek.com/v1"
    MODEL_NAME: "deepseek-chat"
    API_KEY: "replace-me"
    TIMEOUT: "60s"

  qwen:
    PROVIDER: "openai-compatible"
    BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    MODEL_NAME: "qwen-plus"
    API_KEY: "replace-me"
    TIMEOUT: "60s"

  openai:
    PROVIDER: "openai-compatible"
    BASE_URL: "https://api.openai.com/v1"
    MODEL_NAME: "gpt-4.1-mini"
    API_KEY: "replace-me"
    TIMEOUT: "60s"

# 原有扁平配置仍然兼容。使用 MODELS 时不要再配置下面这些字段：
# MODEL_PROVIDER: "openai-compatible"
# MODEL_BASE_URL: "https://api.openai.com/v1"
# MODEL_NAME: "gpt-4.1-mini"
# MODEL_API_KEY: "replace-me"
# MODEL_TIMEOUT: "60s"

# RAG 服务独立部署。API Key 和知识库 ID 只由 Agent 服务端配置，
# 不会出现在 semantic_search_notes 的模型参数中。
RAG:
  ENABLED: false
  BASE_URL: "http://127.0.0.1:8899"
  API_KEY: "replace-me"
  KB_IDS: [2]
  TIMEOUT: "10s"
  TOP_K: 5
  STRATEGY_PROFILE: "default"

# HarnessRuntime 为一次 Agent Run 设置总预算。MODEL TIMEOUT 约束单次 HTTP 请求，
# RUN_TIMEOUT 约束包括模型、Tool、重试和回答校验在内的完整执行时间。
AGENT:
  ENABLE_MULTI_AGENT: false
  ENABLE_INTENT_ROUTING: true
  ENABLE_LEGACY_ROUTING_FALLBACK: true
  INTENT_COMPLEX_THRESHOLD: 120
  INTENT_MIN_WRITE_CONFIDENCE: 0.95
  NOTE_DRAFT_TTL: "24h"
  RUN_TIMEOUT: "90s"
  TOOL_TIMEOUT: "15s"
  MAX_ITERATIONS: 6
  MAX_MODEL_CALLS: 3
  MAX_TOOL_CALLS: 3
  MAX_REPAIR_ATTEMPTS: 1
  MAX_OUTPUT_TOKENS: 2000

# Skill 总开关和 Daily Review 均默认关闭。启用 Daily Review 前必须同时启用
# DATABASE、AUTH、MEMORY 和 AGENT.ENABLE_INTENT_ROUTING。
SKILLS:
  ENABLED: false
  DAILY_REVIEW_ENABLED: false
  TIMEZONE: "Asia/Shanghai"
  MAX_LOOKBACK_DAYS: 31
  MAX_CHAT_MESSAGES: 200
  PER_SESSION_MESSAGES: 50
  MAX_NOTES: 100
  MAX_CONTEXT_CHARS: 24000
  MAX_STEPS: 9
  MAX_MODEL_CALLS: 1
  MAX_TOOL_CALLS: 2
  MAX_REPAIR_ATTEMPTS: 1
  CACHE_TTL: "24h"
  CACHE_LEASE: "2m"
  CACHE_WAIT: "30s"
  SKILL_VERSION: "v1"
  SCHEMA_VERSION: "v1"
  PROMPT_POLICY_VERSION: "v1"

RESILIENCE:
  MODEL_MAX_ATTEMPTS: 2
  RAG_MAX_ATTEMPTS: 3
  RETRY_BASE_DELAY: "200ms"
  RETRY_MAX_DELAY: "2s"
  MODEL_MAX_CONCURRENCY: 8
  RAG_MAX_CONCURRENCY: 16
  CIRCUIT_FAILURE_THRESHOLD: 5
  CIRCUIT_OPEN_TIMEOUT: "30s"

# RAG 服务端必须同时启用 evidence_refusal 和 citation_consistency。
# Agent 默认 fail-closed：服务端未返回 pass 或 citation check 时拒绝回答。
GROUNDING:
  REQUIRE_RAG_FOR_NOTE_QUERY: true
  REQUIRE_EVIDENCE_GATE: true
  REQUIRE_CITATION_CHECK: true
  MIN_RESULTS: 1
  MIN_TOP_SCORE: 0.60
  MIN_ITEM_SCORE: 0.45
  REQUIRE_COMPLETE_CITATION: true
  MAX_CONTEXT_CHARS: 24000
  REJECT_PROMPT_INJECTION: true
